<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator BMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f4; --card:#ffffff; --ink:#12303a; --muted:#5b747c; --line:#cfdcdf; --btn:#12303a; --btn-ink:#ffffff;
  --c-under:#3b82c4; --c-normal:#2f9e6e; --c-over:#e0a12b; --c-obese:#d1495b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b20; --card:#172830; --ink:#e6f0f2; --muted:#8fa8b0; --line:#2b424b; --btn:#e6f0f2; --btn-ink:#0f1b20;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b20; --card:#172830; --ink:#e6f0f2; --muted:#8fa8b0; --line:#2b424b; --btn:#e6f0f2; --btn-ink:#0f1b20;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{margin-bottom:16px}
.field{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.field:focus-within{border-color:var(--ink)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:12px 14px;outline:none}
.unit{padding-right:14px;color:var(--muted);font-size:.9rem}
button{width:100%;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;font-size:1rem;padding:13px;cursor:pointer}
button:focus-visible{outline:3px solid var(--c-normal);outline-offset:2px}
#error{color:var(--c-obese);font-size:.9rem;min-height:1.3em;margin:0 0 10px}
#result{margin-top:24px;display:none}
#result.show{display:block}
.value{font-size:3.2rem;font-weight:800;line-height:1}
.cat{font-size:1.15rem;font-weight:600;margin:6px 0 20px}
.scale{position:relative;height:12px;border-radius:6px;display:flex;overflow:visible}
.scale span{display:block;height:100%}
.scale span:first-child{border-radius:6px 0 0 6px}
.scale span:nth-child(4){border-radius:0 6px 6px 0}
.pin{position:absolute;top:-6px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .4s ease}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:10px}
@media (prefers-reduced-motion: reduce){.pin{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Kalkulator BMI</h1>
  <p class="sub">Masukkan berat dan tinggi badanmu.</p>

  <div class="row">
    <label for="kg">Berat badan</label>
    <div class="field"><input id="kg" type="number" inputmode="decimal" min="1" step="0.1" placeholder="65"><span class="unit">kg</span></div>
  </div>
  <div class="row">
    <label for="cm">Tinggi badan</label>
    <div class="field"><input id="cm" type="number" inputmode="decimal" min="1" step="0.1" placeholder="170"><span class="unit">cm</span></div>
  </div>

  <p id="error" role="alert"></p>
  <button id="hitung" type="button">Hitung BMI</button>

  <section id="result" aria-live="polite">
    <div class="value" id="nilai"></div>
    <div class="cat" id="kategori"></div>
    <div class="scale" aria-hidden="true">
      <span style="width:14%;background:var(--c-under)"></span>
      <span style="width:25.6%;background:var(--c-normal)"></span>
      <span style="width:20%;background:var(--c-over)"></span>
      <span style="flex:1;background:var(--c-obese)"></span>
      <div class="pin" id="pin" style="left:0"></div>
    </div>
    <div class="ticks" aria-hidden="true"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div>
  </section>
</main>

<script>
function hitungBMI() {
  var kg = parseFloat(document.getElementById("kg").value);
  var cm = parseFloat(document.getElementById("cm").value);
  var err = document.getElementById("error");
  var hasil = document.getElementById("result");

  if (!(kg > 0) || !(cm > 0)) {
    err.textContent = "Isi berat dan tinggi badan dengan angka lebih dari 0.";
    hasil.classList.remove("show");
    return;
  }
  err.textContent = "";

  var m = cm / 100;            // cm -> meter
  var imt = kg / (m * m);      // rumus yang sama seperti di C++

  var kategori, warna;
  if (imt < 18.5)      { kategori = "Underweight (kurus)";      warna = "var(--c-under)"; }
  else if (imt < 24.9) { kategori = "Normal";                    warna = "var(--c-normal)"; }
  else if (imt < 29.9) { kategori = "Overweight (kelebihan berat)"; warna = "var(--c-over)"; }
  else                 { kategori = "Obese (obesitas)";          warna = "var(--c-obese)"; }

  document.getElementById("nilai").textContent = imt.toFixed(1);
  var k = document.getElementById("kategori");
  k.textContent = kategori;
  k.style.color = warna;

  // posisi penanda pada skala 15-40
  var pos = Math.min(Math.max((imt - 15) / 25, 0), 1) * 100;
  document.getElementById("pin").style.left = pos + "%";

  hasil.classList.add("show");
}

document.getElementById("hitung").addEventListener("click", hitungBMI);
["kg", "cm"].forEach(function (id) {
  document.getElementById(id).addEventListener("keydown", function (e) {
    if (e.key === "Enter") hitungBMI();
  });
});
</script>
</body>
</html>
